name: Deploy Telegram Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

# Keep one whole publication in flight, including verification and rollback.
concurrency:
  group: interiors-production
  cancel-in-progress: false

jobs:
  telegram:
    name: Verify and package Telegram Mini App
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: node --test scripts/check-repository.test.mjs
      - run: node scripts/check-repository.mjs
      - name: Verify archive validation, the restricted receiver and the encrypted backup relay
        run: >-
          python3 -m unittest -v
          scripts.deploy.test_frontend scripts.deploy.test_receiver scripts.deploy.test_configure_github
          scripts.deploy.test_project_backup_relay
      - name: Verify daily and two-hour Telegram opening totals
        run: python3 -m unittest discover -s scripts/analytics -p 'test_*.py'
      - name: Verify Telegram support delivery and owner reply routing
        run: python3 -m unittest -v scripts.telegram_support.test_support scripts.telegram_support.test_service
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome for the TMA proofs
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chrome
      - name: Type-check the Telegram entry and editor
        working-directory: apps/web
        run: pnpm exec tsc --noEmit -p tsconfig.telegram.json
      - name: Verify Telegram release and delivery contracts
        working-directory: apps/web
        run: >-
          pnpm exec node --test
          scripts/telegram-release-build.test.mjs scripts/telegram-release-build.boundaries.test.mjs
          scripts/telegram-preview-server.test.mjs scripts/telegram-sdk-delivery.test.mjs
          scripts/telegram-sdk-delivery-build.test.mjs scripts/build-telegram-analytics.test.mjs
      - name: Verify Telegram legal document delivery
        working-directory: apps/web
        run: >-
          pnpm exec node --test --test-name-pattern '^Telegram publishes the unmodified legal editions'
          scripts/legal-document-delivery.test.mjs
      - name: Verify the signed Telegram entry with exact floor rotation
        working-directory: apps/web
        env:
          INTERIORS_EXACT_FLOOR_YAW: '1'
          INTERIORS_DOOR_HINGE_AUTHORING: '1'
        run: pnpm exec node scripts/run-telegram-entry.mjs --grep 'TMA-(ENTRY-[0-9]{2}|ITEM-FLUSH-01|CAMERA-FRAMING|OPENINGS|DOOR-HINGE):'
      - name: Verify the scoped Telegram editor and exact project transfer
        working-directory: apps/web
        run: pnpm exec node scripts/run-telegram-runtime-ui.mjs --grep 'TMA-(EXACT-YAW|EXACT-TRANSFER|UI-PLAN-RING|ROTATION-EXPLICIT|WALL-CONTINUITY|WALL-CONSEQUENCES|DOOR-HINGE-TRANSFER|ADD-OPENING|MOVE-OPENING|SCENE-WALL-PICK|UI-RESOURCE-03|ENCRYPTED-DOWNLOAD):'
      - name: Verify door storage upgrade and rollback compatibility
        working-directory: apps/web
        run: pnpm exec node scripts/run-telegram-storage-mutation.mjs --grep 'TMA-DOOR-HINGE-STORAGE:'
      - name: Build the configured Telegram production target
        working-directory: apps/web
        env:
          INTERIORS_TELEGRAM_BOT_ID: '9112733311'
          INTERIORS_TELEGRAM_ENVIRONMENT: production
          INTERIORS_TELEGRAM_LINK: https://t.me/InteriorsEditorBot?startapp
          INTERIORS_EXACT_FLOOR_YAW: '1'
          INTERIORS_DOOR_HINGE_AUTHORING: '1'
          INTERIORS_TELEGRAM_OUTPUT: ${{ runner.temp }}/interiors-release/dist-telegram
        run: pnpm exec rspack build --mode production --config rspack.telegram.config.mjs
      - name: Seal the Telegram deployment archive
        run: >-
          python3 scripts/deploy/frontend.py package-telegram
          --telegram "$RUNNER_TEMP/interiors-release/dist-telegram"
          --output "$RUNNER_TEMP/interiors-release/telegram.tar.gz" --commit "$GITHUB_SHA"
      - name: Preserve the exact Telegram deployment candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: telegram-${{ github.sha }}
          path: ${{ runner.temp }}/interiors-release/telegram.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    name: Publish Telegram Mini App
    needs: telegram
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://domiknote.ru/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: telegram-${{ github.sha }}
          path: ${{ runner.temp }}/interiors-release
      - name: Refuse publication of a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - name: Send the verified archive through the restricted SSH receiver
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/interiors-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          archive="$RUNNER_TEMP/interiors-release/telegram.tar.gz"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          size=$(wc -c < "$archive" | tr -d ' ')
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$ssh_dir/key" \
            root@147.45.133.75 "deploy-telegram $GITHUB_SHA $digest $size" < "$archive" \
            > "$RUNNER_TEMP/interiors-release/deployment-receipt.json"
      - name: Verify public HTTPS delivery from the GitHub runner
        run: >-
          python3 scripts/deploy/frontend.py smoke-telegram
          --archive "$RUNNER_TEMP/interiors-release/telegram.tar.gz"
          --receipt "$RUNNER_TEMP/interiors-release/deployment-receipt.json"
      - name: Record the published commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          printf 'Published [Telegram Mini App](https://domiknote.ru/) at `%s`.\n' "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
