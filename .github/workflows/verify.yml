name: Verify InteriorsEditor

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_call:
    inputs:
      package_release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      mutation_scope:
        description: Mutation verification scope
        type: choice
        default: hardening
        options: [hardening, full]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  telegram:
    name: Telegram Mini App and shared frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use the runner's temporary directory for Telegram evidence
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers for Telegram runtime and analytics checks
        run: pnpm --filter @interiors/web exec playwright install --with-deps chrome webkit
      - run: pnpm run lint
      - run: pnpm run check:architecture
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Build the configured Telegram production target
        env:
          INTERIORS_TELEGRAM_BOT_ID: '9112733311'
          INTERIORS_TELEGRAM_ENVIRONMENT: production
          INTERIORS_TELEGRAM_LINK: https://t.me/InteriorsEditorBot?startapp
          INTERIORS_EXACT_FLOOR_YAW: '1'
          INTERIORS_DOOR_HINGE_AUTHORING: '1'
          INTERIORS_TELEGRAM_OUTPUT: ${{ runner.temp }}/interiors-verify/dist-telegram
        run: pnpm run build
      - run: pnpm run test:delivery
      - name: Verify daily totals and device consent in Chrome and WebKit
        working-directory: apps/web
        run: |
          node --test scripts/build-telegram-analytics.test.mjs
          pnpm exec node scripts/run-telegram-analytics.mjs
      - run: pnpm run test:e2e
      - name: Seal the tested Telegram build
        if: inputs.package_release == true
        run: >-
          python3 scripts/deploy/frontend.py package-telegram
          --telegram "$RUNNER_TEMP/interiors-verify/dist-telegram"
          --output "$RUNNER_TEMP/interiors-verify/telegram.tar.gz" --commit "$GITHUB_SHA"
      - name: Preserve the exact deployment candidate
        if: inputs.package_release == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: telegram-${{ github.sha }}
          path: ${{ runner.temp }}/interiors-verify/telegram.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve Telegram verification failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: telegram-verification-failure-evidence
          path: |
            ${{ runner.temp }}/interiors-tma-*
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  shared-mutation:
    name: Selected frontend and shared-core mutation scope
    if: github.event_name == 'workflow_dispatch' && inputs.package_release != true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Verify the hardening scopes
        if: inputs.mutation_scope == 'hardening'
        run: pnpm run test:mutation:hardening
      - name: Verify all domain and application code
        if: inputs.mutation_scope == 'full'
        run: pnpm run test:mutation
      - name: Preserve mutation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shared-mutation-reports
          path: apps/web/reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  catalog:
    name: Kotlin catalog and PostgreSQL 18.4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/catalog-control-plane
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Docker for Testcontainers
        run: docker info
      - name: Test with strict dependency verification and the pinned database image
        run: ./gradlew --no-daemon --dependency-verification=strict test
      - name: Package the tested catalog service
        if: inputs.package_release == true
        run: |
          ./gradlew --no-daemon --dependency-verification=strict installDist
          python3 ../../scripts/deploy/catalog_package.py \
            --distribution build/install/interiors-catalog-control-plane \
            --output "$RUNNER_TEMP/catalog.tar.gz" --commit "$GITHUB_SHA"
      - name: Preserve the exact catalog distribution
        if: inputs.package_release == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: catalog-${{ github.sha }}
          path: ${{ runner.temp }}/catalog.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Check backend mutation strength
        if: github.event_name == 'workflow_dispatch' && inputs.package_release != true
        run: ./gradlew --no-daemon --dependency-verification=strict pitest
      - name: Preserve backend reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: catalog-test-and-mutation-reports
          path: apps/catalog-control-plane/build/reports/
          if-no-files-found: ignore
          retention-days: 7
