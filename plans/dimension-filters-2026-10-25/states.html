<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.35 system-ui;color:#17223a;background:#fafbfc;height:100vh}header{background:white;border-bottom:1px solid #d5dce5;padding:16px;display:grid;gap:12px}nav{display:flex;gap:8px}button{font:inherit;min-height:46px;padding:8px 14px;border:1px solid #d5dce5;border-radius:10px;background:white;color:#1b79b5}button.active{background:#1b79b5;color:white}svg{width:100%;height:360px}aside{background:white;border:1px solid #d5dce5;border-radius:20px 20px 0 0;position:absolute;bottom:0;left:0;right:0;padding:20px;max-height:75vh;overflow:auto}label{display:flex;gap:12px;align-items:center;min-height:50px;border-bottom:1px solid #eef0f4}input{width:20px;height:20px;accent-color:#1b79b5}footer{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-around;background:white;border:1px solid #d5dce5;padding:10px;border-radius:16px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}</style><header><b>Мой проект</b><nav><button class="active">План</button><button>3D</button><button id="open">Размеры</button></nav></header><svg viewBox="0 0 360 360"><path id="walls" d="M60 80H300V300H60Z" fill="white" stroke="#555" stroke-width="7"/><g id="dims" fill="#17223a" font-size="14"><path d="M82 105H278M85 102v6m190-6v6M82 105V275" fill="none" stroke="#888"/><text x="165" y="125">4000</text><text x="105" y="205" transform="rotate(-90 105 205)">3000</text></g></svg><footer><button>Комната</button><button>Стена</button><button>Предмет</button></footer><aside hidden><h2>Размеры, мм</h2><div id="list"></div><div class="actions"><button id="all">Показать всё</button><button id="clear">Скрыть всё</button></div><div class="actions"><button id="done">Готово</button></div></aside><script>const s=new URLSearchParams(location.search).get('state');const aside=document.querySelector('aside');for(const[n,i]of['Внутренние размеры','Внешние габариты','Стены по осям','Ширина проёмов','Простенки по осям'].map((n,i)=>[n,i])){const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${i===0?'checked':''}>${n}`;document.querySelector('#list').append(l)}document.querySelector('#open').onclick=()=>aside.hidden=false;document.querySelector('#done').onclick=()=>aside.hidden=true;document.querySelector('#all').onclick=()=>document.querySelectorAll('input').forEach(i=>i.checked=true);document.querySelector('#clear').onclick=()=>document.querySelectorAll('input').forEach(i=>i.checked=false);if(s==='filter')aside.hidden=false;if(s==='none'||s==='three')document.querySelector('#dims').remove();if(s==='three'){document.querySelector('#open').hidden=true;document.querySelector('svg').innerHTML='<path d="M60 125 180 55 300 125V260L180 330 60 260Z" fill="#eee" stroke="#777" stroke-width="5"/><path d="M60 125 180 195 300 125M180 195V330" fill="none" stroke="#aaa"/>';document.querySelector('footer').innerHTML='<button>Предмет</button><button>Авто</button><button>Все стены</button>'}</script></html>
