<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Состояния редактора</title><style>:root{--ink:#192436;--blue:#1976b9;--canvas:#f4f6f8;--line:#d9e1e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--canvas);font:15px/1.4 -apple-system,BlinkMacSystemFont,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px;background:white;border-bottom:1px solid var(--line);min-height:56px}main{height:380px;background:linear-gradient(90deg,#dce5eb55 1px,transparent 1px),linear-gradient(#dce5eb55 1px,transparent 1px);background-size:24px 24px;display:grid;place-items:center;position:relative}.room{width:230px;height:190px;border:8px solid #647789;background:#fff8;position:relative}.door{position:absolute;left:70px;bottom:-8px;width:62px;height:8px;background:#f4f6f8}.handle{position:absolute;left:84px;bottom:-26px;width:48px;height:48px;border:0;background:transparent;padding:18px;touch-action:none}.handle:after{content:'';display:block;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px white}.card{margin:12px;padding:16px;border:1px solid var(--line);background:white;border-radius:18px;display:grid;gap:12px}.head{display:grid;grid-template-columns:40px 1fr 48px;align-items:center;gap:10px}.head strong{font-size:17px}.head span{color:#52647b}button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--blue);font:600 14px/1.4 inherit;padding:10px;cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px}input{min-height:48px;width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px}.actions{display:flex;gap:8px}.actions>*{flex:1}.legend{position:absolute;left:16px;top:12px;font-size:12px}.dome{width:200px;height:128px;border-radius:120px 120px 20px 20px;background:#1976b929;border:3px solid var(--blue);display:grid;place-items:center;color:var(--blue);position:absolute;top:160px}.item{width:100px;height:62px;background:#b99062;border:3px solid #87633d;transform:rotate(-25deg)}svg{overflow:visible}small{color:#52647b}</style><header><button>‹</button><strong>Моя планировка</strong><span>Сохранено</span></header><main><div class="room"><div class="door"></div><button class="handle" aria-label="Переместить проём"></button></div></main><section class="card" id="panel"></section><script>
const state=new URL(location).searchParams.get('state');const panel=document.querySelector('#panel');const main=document.querySelector('main');
const head=(title,sub)=>`<div class="head"><span>▱</span><div><strong>${title}</strong><br><small>${sub}</small></div><button aria-label="Закрыть">×</button></div>`;
if(state==='opening'){panel.innerHTML=head('Новый проём','Стена 1 · свободное место найдено')+`<div class="actions"><button class="primary">Дверь</button><button>Окно</button></div><div class="fields"><label>Ширина, мм<input value="900"></label><label>Высота, мм<input value="2100"></label></div><small>Дверь появится на свободном участке. Положение можно изменить на плане.</small><div class="actions"><button>Отмена</button><button class="primary">Добавить</button></div>`}
else if(state==='rotation'){main.innerHTML='<div class="item"></div><div class="dome">↶ &nbsp; 45° &nbsp; ↷</div>';panel.innerHTML=head('Поворот предмета','Потяните за полусферу')+'<div class="actions"><button>−45°</button><button>+45°</button><button>Отмена</button></div>'}
else if(state==='dimensions'){main.innerHTML='<span class="legend">Размеры в миллиметрах · по осям</span><svg width="280" height="250" viewBox="0 0 280 250"><path d="M30 60H250V220H30Z" fill="#fff8" stroke="#647789" stroke-width="8"/><path d="M30 35H250 M30 25V60 M250 25V60 M20 45l20-20 M240 45l20-20" fill="none" stroke="#52647b"/><text x="140" y="26" text-anchor="middle">4000</text><path d="M30 235H110 M110 235H170 M170 235H250 M30 220V245 M110 220V245 M170 220V245 M250 220V245" fill="none" stroke="#52647b"/><text x="70" y="230" text-anchor="middle">1450</text><text x="140" y="230" text-anchor="middle">1100</text><text x="210" y="230" text-anchor="middle">1450</text><text x="140" y="140" text-anchor="middle">В чистоте: 3900 × 2900</text></svg>';panel.innerHTML=head('План 2D','Размеры обновляются вместе с геометрией')+'<small>Размеры по осям и в чистоте различаются явно. Подписи не перехватывают жесты.</small>'}
else if(state==='drag'){panel.innerHTML=head('Перемещение проёма','Потяните маркер вдоль стены')+'<small>Палец не меняет ширину/высоту и не переносит проём на другую стену. Второй палец отменяет перемещение.</small><button>Отменить перемещение</button>'}
else{panel.innerHTML=head('Стена','Длина 4000 мм')+'<div class="actions"><button class="primary">Добавить проём</button><button>Разделить</button></div><small>Кружок разделения можно двигать вдоль стены.</small><div class="actions"><button>Отмена</button><button class="primary">Подтвердить разделение</button></div>'}
</script></html>
